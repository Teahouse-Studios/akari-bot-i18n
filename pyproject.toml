[project]
name = "akari-bot-i18n"
version = "0.1.0"
description = ""
authors = [
    {name = "OasisAkari", email = "OasisAkari@gmail.com"},
    {name = "DoroWolf", email = "dorowolf314@gmail.com"}
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "orjson>=3.11.7",
]

[project.urls]
Homepage = "https://github.com/Teahouse-Studios/akari-bot-i18n"
Issues = "https://github.com/Teahouse-Studios/akari-bot-i18n/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/akari_bot_i18n"]

[tool.hatch.build.targets.wheel]
packages = ["akari_bot_i18n"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E402", "F405", "F403", "E741", "E721"]

[tool.ruff.format]
quote-style = "double"
